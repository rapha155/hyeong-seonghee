<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 탭</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="slides-v2.css">
</head>
<body>
<nav class="nav"><a href="resume.html">이력서</a><a href="portfolio.html" class="on">포트폴리오</a><a href="portfolio-old.html">이전 버전</a>
  <button class="dl" onclick="window.print()">PDF로 저장</button></nav>
<main class="slides" id="app"></main>

<script src="portfolio-v2-data.js"></script>
<script>
const slide = (cls, html, foot = "") => `<section class="slide ${cls}"><div class="in">${html}${foot ? `<div class="foot">${foot}</div>` : ""}<div class="no"></div></div></section>`;
const chips = (a, cls = "") => a.map(x => `<span class="chip ${cls}">${x}</span>`).join("");
const img = (i, cls = "") => `<img class="${cls}" src="screenshots/${i}" alt="">`;
// 항목 하나(예: Node.js Lambda)는 줄바꿈 없이, " · "는 앞 항목에 붙여 줄 맨 앞에 오지 않게
const meta = m => `<dl class="meta">${m.map(([k, v]) => `<dt>${k}</dt><dd>${v.split(" · ").map(x => `<span class="nb">${x}</span>`).join(" · ")}</dd>`).join("")}</dl>`;
const results = r => `<div class="results">${r.map(k => `<div><div class="lead">${k.lead}</div><div class="sub">${k.sub}</div></div>`).join("")}</div>`;
const link = t => `<a href="${t.includes("@") ? "mailto:" + t : /^[0-9-]+$/.test(t) ? "tel:" + t.replace(/-/g, "") : "https://" + t}" target="_blank">${t}</a>`;
const c = PF.cover, g = PF.glance, ix = PF.index, tl = PF.timeline;

const coverSlide = slide("cover", `
  <div class="year">${c.year}</div>
  <h1>${c.name}<span>${c.latin}</span></h1>
  <div class="crole">${c.role}</div>
  <p class="pos">${c.tagline}</p>
  <div class="cover-foot"><span>${c.now}</span><span>${c.contacts.map(link).join("  ·  ")}</span></div>`);

const glanceSlide = slide("glance", `
  <h2>${g.title}</h2>
  <p class="g-head">${g.headline}</p>
  <div class="g-intro">${g.intro.map(t => `<p>${t}</p>`).join("")}</div>
  <div class="g-stats">${g.stats.map(x => `<div><b>${x.n}</b><span>${x.label}</span></div>`).join("")}</div>
  <div class="g-areas">${g.areas.map(a => `<div><h3>${a.title}</h3><p>${a.desc}</p><div class="refs">→ ${a.refs}</div></div>`).join("")}</div>
  `,
  g.stack);

const timelineSlide = slide("timeline", `
  <h2>Timeline<small>2023.09 ~ 현재</small></h2>
  <table class="tl-table"><thead><tr><th>구분</th><th>기간</th><th>무엇을</th></tr></thead>
    ${tl.groups.map(gr => `<tbody class="tl-group">${gr.rows.map((r, i) => `<tr>${i ? "" : `<th rowspan="${gr.rows.length}">${gr.name}${gr.sub ? `<small>${gr.sub.join("<br>")}</small>` : ""}</th>`}<td>${r[0]}</td><td><b>${r[1]}</b>${r[2]}</td></tr>`).join("")}</tbody>`).join("")}</table>`);

const indexSlide = slide("index", `
  <h2>${ix.title}<small>${ix.items.length}개</small></h2>
  <div class="cards">${ix.items.map(p => `<div class="card"><div class="thumb${p.phone ? " phone" : ""}">${img(p.thumb, p.bare ? "bare" : "")}</div>
    <div class="cname">${p.name}</div><div class="cline">${p.line}</div><div class="cmeta"><span>${p.tag}</span><span>${p.period}</span></div></div>`).join("")}</div>`);

let pno = 0;
const phead = (name, org) => `<div class="phead"><span class="pno">프로젝트 ${++pno}</span><span class="porg">${org}</span></div>`;
const brief = p => `<dl class="brief"><dt>기획 배경</dt><dd>${p.background}</dd><dt>핵심 문제</dt><dd>${p.problem}</dd></dl>`;
// 프로젝트 첫 장: 왼쪽 개요 · 오른쪽 대표 화면 · 아래 성과 3개
const povSlide = (p, cls = "pov") => slide(cls, `${phead(p.name, p.org)}
    <div class="pov-grid">
      <div class="pov-left">
        <h2>${p.name}</h2>
        <p class="plain">${p.plain}</p>
        ${p.summary ? `<p class="sum">${p.summary}</p>` : ""}
        ${brief(p)}
        ${meta([["역할", p.role], ...p.meta])}
        ${p.other ? `<p class="other">${p.other}</p>` : ""}
        ${p.structure ? `<div class="struct"><div class="struct-cap">프론트엔드 구조</div><dl>${p.structure.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>` : ""}
      </div>
      <figure class="hero">${img(p.hero)}<figcaption>${p.caption}</figcaption></figure>
    </div>
    ${results(p.results)}`);
const projectSlides = p => {
  const n = pno + 1;
  const a = povSlide(p);
  const b = slide("ptask", `<div class="phead"><span class="pno">프로젝트 ${n}</span><span class="porg">${p.org}</span></div>
    <h2>${p.name}<small>핵심 과제 ${p.tasks.length}</small></h2>
    <div class="tasks">${p.tasks.map(t => `<div class="task"><h3>${t.title}</h3>
      <div class="row"><div class="rl">문제</div><p>${t.problem}</p></div>
      <div class="row"><div class="rl">해결</div><p>${t.solution}</p></div>
      <div class="row res"><div class="rl">결과</div><p>${t.result}</p></div></div>`).join("")}</div>`);
  return a + b;
};

const cmsSlide = () => povSlide(PF.cms, "pov cms");

// RAG 흐름도: 질문 → 캐시 → 하이브리드 검색 → 근거 → 생성 → 답변, 아래에 사전 준비 단계
const node = ([t, d], cls = "") => `<div class="rf-node ${cls}"><b>${t}</b><span>${d}</span></div>`;
const arrow = (label = "") => `<div class="rf-arrow"><i></i>${label ? `<em>${label}</em>` : ""}</div>`;
const ragFlow = f => `<div class="rag-flow">
  <div class="rf-ask">${f.ask}</div>${arrow()}
  <div class="rf-cache">${node(f.cache)}<div class="rf-hit"><span><b>있으면 바로 응답</b><br>${f.cache[2]}</span></div></div>${arrow("캐시에 없으면")}
  <div class="rf-search"><div class="rf-cap">하이브리드 검색</div><div class="rf-pair">${f.search.map(x => node(x)).join("")}</div></div>${arrow(f.merge)}
  ${node(f.context)}${arrow()}${node(f.llm, "llm")}${arrow()}
  <div class="rf-answer">${f.answer}</div>
  <div class="rf-prep"><div class="rf-cap">사전 준비</div><div class="rf-steps">${f.prep.map(x => `<span>${x}</span>`).join("<i>→</i>")}</div></div>
</div>`;
const ragSlide = () => { const r = PF.rag; return slide("rag", `${phead(r.name, r.org)}
  <div class="rag-grid">
    <div><h2>${r.name}</h2><p class="plain">${r.plain}</p>${brief(r)}${meta([["역할", r.role], ...r.meta])}</div>
    <div class="rag-media">${img(r.phone, "rag-phone")}${ragFlow(r.flow)}</div>
  </div>
  ${results(r.results)}`); };

const appsSlide = () => { const a = PF.apps; return slide("apps", `${phead(a.title, "개인 · 출시 앱")}
  <h2>${a.title}</h2>
  <p class="plain">${a.sub}</p>
  <div class="app-grid">${a.items.map(x => `<div class="app">${img(x.img, x.bare ? "bare" : "")}<h3>${x.name}<small>${x.period}</small></h3><p>${x.line}</p><div class="tech">${x.tech}</div>${x.link ? `<a class="store" href="https://${x.link.split(" ")[0]}" target="_blank">App Store</a>${x.link.includes("Google") ? `<span class="store-sep">·</span><a class="store" href="https://play.google.com/store/apps/details?id=com.seonghee.korean_history_app" target="_blank">Google Play</a>` : ""}` : ""}</div>`).join("")}</div>`); };

const workSlide = () => { const w = PF.work; return slide("work", `
  <h2>${w.title}</h2>
  <div class="work-grid">${w.items.map(x => `<div><h4>${x.h}</h4><p>${x.p}</p></div>`).join("")}</div>`); };

const outroSlide = slide("cover outro", `
  <h1>${PF.outro.title}</h1><p class="pos">${PF.outro.lead}</p>
  <dl class="outro-contacts">${PF.outro.contacts.map(([k, v]) => `<dt>${k}</dt><dd>${link(v)}</dd>`).join("")}</dl>
  <div class="cover-foot"><span></span><span>${PF.outro.sign}</span></div>`);

document.getElementById("app").innerHTML = coverSlide + glanceSlide + timelineSlide + indexSlide
  + PF.projects.map(projectSlides).join("") + cmsSlide() + ragSlide() + appsSlide() + workSlide() + outroSlide;

const fit = el => el.style.setProperty("--s", el.clientWidth / 1280);
const ro = new ResizeObserver(es => es.forEach(e => fit(e.target)));
document.querySelectorAll(".slide").forEach(el => { ro.observe(el); el.addEventListener("click", () => el.classList.toggle("zoom")); });
</script>
</body>
</html>
